# Single-View Attribute Decomposition Agent
# Single-view with attribute decomposition: one look per episode
# Split the description into attributes, ask about each in turn, no Unsure allowed, then vote

# Prompt Templates
prompt:
    version: single_view_attr
    extract_file: "extract_v1.yaml"
    verify_file: "verify_v1.yaml"
    nav_file: null  # no navigation needed
    category_file: "category_v1.yaml"

method:
    name: "mllm"
    agent_type: "single_view_attr"
    
    # use attribute decomposition
    use_attribute_decomposition: true
    max_attributes: 8
    
    # attribute query mode
    query_mode: "attribute"
    
    # Unsure is not allowed
    allow_unsure: false
    
    # voting strategy
    voting_strategy: "majority"
    
    # attribute match threshold
    match_threshold: 0.75
    
    # coarse category mode
    coarse_mode: "infer"
    bbox_mode: "dino"
    input_mode: "env"
    
    # decision mode
    decision_mode: "early_exit"

env:
    max_steps: 1
    sectors: 6
    view_priority: "far"

dataset:
    root: "./data/pv_dataset"
    capture_subdir: "pin_capture"
    image_gt_root: "./data/pv_dataset/image_gt"
    category_cache_path: "./data/pv_dataset/category_cache.json"
    split: "val"
    index_file: "pv_index_50.jsonl"
    desc_db: "./data/pv_dataset/object_descriptions_with_category.json"

output:
    root: "./outputs/single_view_attr"
    save_viz: true

server:
    qwen_text_url: "http://127.0.0.1:12182/qwen-text"
    qwen_vl_url: "http://127.0.0.1:12182/qwen-vl"
    gdino_url: "http://127.0.0.1:12183/groundingdino"

evaluation:
    unsure_as_negative: true
